name: digital_safe
description: Digital Safe - Kho lưu trữ cá nhân an toàn tuyệt đối.

publish_to: "none"

version: 1.0.1+2

environment:
  sdk: ">=3.4.3 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  cupertino_icons: ^1.0.6
  provider: ^6.1.5
  shared_preferences: ^2.5.3
  flutter_secure_storage: ^9.2.4
  google_fonts: ^6.3.3
  uuid: ^4.1.0
  in_app_purchase: ^3.2.1
  http: ^1.2.2
  intl: ^0.20.2
  share_plus: ^10.1.4
  path_provider: ^2.1.5
  path: ^1.9.1
  encrypt: ^5.0.3
  file_picker: ^8.3.7
  image_picker: ^1.1.2
  crypto: ^3.0.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  flutter_launcher_icons: ^0.14.3

flutter_launcher_icons:
  android: true
  ios: true
  image_path: assets/logo.png
  adaptive_icon_background: "#0A1628"
  adaptive_icon_foreground: assets/icon_foreground.png
  remove_alpha_ios: true

flutter:
  uses-material-design: true
  assets:
    - assets/logo.png
    - assets/icon_foreground.png
